{% set name = "django-fsm-log" %}
{% set version = "6.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: eb6511da626c1d2c8aab26ed2fab987386e2975fe30cf61104d0ff6172ed78db

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
    - hatch-vcs
  run:
    - django-fsm-2
    - python >={{ python_min }}
    - django >=4.2
    - django-appconf

test:
  imports:
    - django_fsm_log
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/gizmag/django-fsm-log
  summary: Logging for django-fsm
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
    - cshaley
    - pb01ka
